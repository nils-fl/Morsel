# electron-builder: `npm run desktop:dist` makes release/Morsel-<version>-arm64.dmg.
# Signed ad hoc (mac.identity "-"): it runs on this Mac, and on others after right-click → Open. With a Developer ID
# certificate in the keychain, put its name in mac.identity; with APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
# APPLE_TEAM_ID set it's notarized too.
appId: com.nilsflaschel.morsel
productName: Morsel
directories:
  output: release
files:
  - package.json
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - "!dist/og-image.png"
  # The page is bundled by Vite: no node_modules at run time.
  - "!node_modules/**"
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.music
  # Rendered by npm run og-image from public/favicon.svg.
  icon: electron/icon.png
  identity: "-"
  hardenedRuntime: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Morsel records samples from your audio input.
    NSAudioCaptureUsageDescription: Morsel records samples from what your Mac is playing.
